[project]
name = "avto_num"
version = "1.0.0"
description = "License Plate Character Detection and OCR Pipeline"
requires-python = ">=3.10"
authors = [
    {name = "Elena", email = "elena@example.com"}
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.1.0",
    "albumentations>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "loguru>=0.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
